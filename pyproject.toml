[tool.poetry]
name = "moex-bot"
version = "0.1.0"
description = "Multi-agent LLM trading bot for MOEX AI Hackathon 2026"
authors = ["moex-bot team"]
readme = "README.md"
license = "MIT"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.7"
instructor = "^1.3"
openai = "^1.30"
tenacity = "^8.2"
httpx = "^0.27"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
alembic = "^1.13"
asyncpg = "^0.29"

[tool.poetry.group.dev.dependencies]
ruff = "^0.4"
mypy = "^1.9"
pytest = "^8.1"
pytest-asyncio = "^0.23"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
